name: Bug or usability issue
description: Report a broken interaction or display problem.
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device or viewport size
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional context
      description: Remove personal information before attaching screenshots.
